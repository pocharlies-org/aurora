name: Publish PR 602 images

on:
  workflow_dispatch:

concurrency:
  group: publish-pr602-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/pocharlies-org
  SOURCE_SHA: e35121aeb7d80293d2e4ce462fe2bc05d9adb469
  IMAGE_TAG: sha-e35121aeb7d80293d2e4ce462fe2bc05d9adb469

jobs:
  publish:
    name: Build and publish Aurora images
    runs-on: arc-k8s
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the audited source commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the official server target
        id: build-server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./server
          file: ./server/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/aurora-server:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/pocharlies-org/aurora
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=pr602-aurora-server
          cache-to: type=gha,mode=max,scope=pr602-aurora-server

      - name: Build and push the official frontend target
        id: build-frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./client
          file: ./client/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/aurora-frontend:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/pocharlies-org/aurora
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:5080
            NEXT_PUBLIC_WEBSOCKET_URL=ws://localhost:5006
            NEXT_PUBLIC_ENABLE_OVH=true
            NEXT_PUBLIC_ENABLE_PAGERDUTY_OAUTH=true
            NEXT_PUBLIC_ENABLE_SHAREPOINT=true
          cache-from: type=gha,scope=pr602-aurora-frontend
          cache-to: type=gha,mode=max,scope=pr602-aurora-frontend

      - name: Verify both published multi-arch indexes
        env:
          SERVER_DIGEST: ${{ steps.build-server.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          set -euo pipefail
          for image_digest in \
            "aurora-server:${SERVER_DIGEST}" \
            "aurora-frontend:${FRONTEND_DIGEST}"; do
            image=${image_digest%%:*}
            digest=${image_digest#*:}
            ref="${REGISTRY}/${image}@${digest}"
            docker buildx imagetools inspect "$ref"
            platforms=$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            echo "${image} platforms: ${platforms}"
            grep -q 'linux/amd64' <<<"$platforms"
            grep -q 'linux/arm64' <<<"$platforms"
            echo "${image} image: ${ref}"
          done
